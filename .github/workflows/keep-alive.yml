name: Supabase Keep-Alive

on:
  schedule:
    - cron: '17 3 * * *'   # 每天 UTC 03:17（北京时间 ~11:17）
  workflow_dispatch:        # 允许手动触发

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "https://cbzmnpogteihbywamvlp.supabase.co/auth/v1/health"
          echo ""
          echo "Supabase ping completed."
