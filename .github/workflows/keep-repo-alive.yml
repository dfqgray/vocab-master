name: Keep Repo Alive

# 目的：定期自动 push 一个心跳 commit，保持仓库"活跃"，
# 防止 GitHub 因 60 天无 commit 而禁用 keep-alive.yml 的 scheduled workflow。
on:
  schedule:
    - cron: '0 4 * * 1'   # 每周一 UTC 04:00（北京时间 12:00）
  workflow_dispatch:        # 允许手动触发

permissions:
  contents: write           # 允许 GITHUB_TOKEN 推送

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 写入心跳时间戳
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/alive.txt

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/alive.txt
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: keep-alive heartbeat $(date -u +%Y-%m-%d)"
          git push
